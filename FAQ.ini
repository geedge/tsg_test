Q: 新机器上需要做哪些准备工作?
A: 配置管理口, 用于跟MS和测试机通信。部署git和对应的账号, 便于从git中拉代码。

Q: start.sh文件放在哪?
A: start.sh文件放在/opt目录下。

Q: start_service.sh与start.sh有什么区别?
A: 对于新系统，只需要在/opt下运行./start.sh即可, 自动构建并启动所有服务。而start_service.sh是用于单独启动docker以及托管服务。

Q: configuration_file.ini中每个参数的含义?
A: selenium_server用于ui自动化, 因为docker中的镜像会自动寻址并修改selenium的ip, 所以该参数在docker中没意义。test_pc是测试机的业务ip。traffic_server是测试机的管理ip。traffic_port是测试机接收rest api的接口。traffic_intf是测试机trex发流量的接口。

Q: 安装trex的注意事项?
A: trex是部署在基础镜像中, 如果在configuration_file.ini修改trex的收发包接口后, 需要重新构建基础镜像。

Q: MobaXterm等工具运行sh时, 需要的注意事项？
A: 如果MobaXterm等工具不关闭, 要电脑设置中的ssh keepalive。如果MobaXterm不能长时间保持开启, 则需要带着nohup执行命令行, 即: nohup ./start_service.sh &或nohup ./start.sh &