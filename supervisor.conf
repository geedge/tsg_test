[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log 

[program:selenium]
command=/usr/bin/java -jar /app/package/selenium-server-4.8.1.jar standalone
stdout_logfile=/var/log/selenium_stdout.log
stderr_logfile=/var/log/selenium_stderr.log

[program:gunicorn]
command=/usr/local/bin/gunicorn -c /app/gunicorn.conf.py app:app
stdout_logfile=/var/log/gunicorn_stdout.log
stderr_logfile=/var/log/gunicorn_stderr.log
